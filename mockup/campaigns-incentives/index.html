<!doctype html>

    <body>
        <!-- Prototype controls: not product UI. Nothing here is saved or sent anywhere. -->
        <aside class="proto-bar" aria-labelledby="proto-title">
            <div class="proto-bar-inner">
                <p id="proto-title" class="proto-title">
                    <span class="proto-tag">Mockup</span> Campaigns and Incentives (D42–D44)
                </p>
                <div class="proto-field">
                    <label for="proto-role">Signed in as</label>
                    <select id="proto-role">
                        <option value="brand">Brand owner · Habi Home</option>
                        <option value="partner">Partner owner · Studio Alon Creative</option>
                    </select>
                </div>
                <div class="proto-field">
                    <label for="proto-screen">Screen</label>
                    <select id="proto-screen"></select>
                </div>
                <div class="proto-field">
                    <label for="proto-state">State</label>
                    <select id="proto-state">
                        <option value="populated">Populated</option>
                        <option value="empty">First use (nothing yet)</option>
                        <option value="ended">Studio Alon relationship ended</option>
                    </select>
                </div>
                <div class="proto-field">
                    <label for="proto-palette">Personal accent</label>
                    <select id="proto-palette">
                        <option value="burgundy">Burgundy (default)</option>
                        <option value="purple">Purple</option>
                    </select>
                </div>
                <div class="proto-field">
                    <label for="proto-annot">Notes</label>
                    <select id="proto-annot">
                        <option value="show">Show design notes</option>
                        <option value="hide">Hide design notes</option>
                    </select>
                </div>
                <p id="proto-status" class="proto-status" role="status" aria-live="polite">
                    Synthetic data. Changes reset when you change State or reload.
                </p>
            </div>
        </aside>

        <div class="wd-portal wd-portal-light" id="portal">
            <a class="wd-skip-link" href="#main-content">Skip to main content</a>
            <header class="wd-portal-header">
                <div class="wd-portal-header-inner">
                    <button type="button" class="wd-portal-menu-button" id="menu-open" aria-controls="drawer">
                        <svg class="i" width="20" height="20" aria-hidden="true">
                            <use href="#i-menu" /></svg
                        ><span class="wd-sr-only">Menu</span>
                    </button>
                    <div class="wd-portal-masthead">
                        <span class="wd-portal-brand">
                            <svg class="wd-logo" width="36" height="34" aria-hidden="true">
                                <use href="#i-logo" /></svg
                            ><span class="wd-wordmark">WeavDash</span>
                        </span>
                        <p class="wd-portal-identity">
                            <span class="wd-portal-experience" data-bind="experience">Brand</span>
                        </p>
                    </div>
                    <div class="wd-portal-actions">
                        <button
                            type="button"
                            class="wd-account-trigger"
                            aria-haspopup="menu"
                            data-demo="Opens the existing account menu. Not part of this proposal."
                        >
                            <span class="wd-sr-only">Account menu: </span
                            ><span class="wd-account-workspace" data-bind="workspace"></span
                            ><span class="wd-avatar" data-bind="initials"></span>
                        </button>
                    </div>
                </div>
            </header>
            <div class="wd-portal-body">
                <div class="wd-portal-sidebar">
                    <div class="wd-portal-sidebar-inner">
                        <div id="portal-sidebar" class="wd-portal-sidebar-scroll" data-nav="sidebar"></div>
                        <button
                            type="button"
                            class="wd-portal-collapse"
                            id="collapse"
                            aria-controls="portal-sidebar"
                            aria-expanded="true"
                        >
                            <svg class="i" width="20" height="20" aria-hidden="true">
                                <use href="#i-panel" />
                            </svg>
                            <span class="collapse-label">Collapse<span class="wd-sr-only"> navigation</span></span>
                        </button>
                    </div>
                </div>
                <div class="wd-portal-content">
                    <main id="main-content" class="wd-portal-page ci-page" tabindex="-1"></main>
                </div>
            </div>
        </div>

        <dialog id="drawer" class="wd-portal-drawer" aria-labelledby="drawer-title">
            <div class="wd-portal-drawer-header">
                <div>
                    <h2 id="drawer-title" class="wd-portal-drawer-title" data-bind="menu-title">Brand menu</h2>

                </div>
                <button type="button" class="wd-portal-menu-button" id="menu-close">
                    <svg class="i" width="20" height="20" aria-hidden="true">
                        <use href="#i-x" /></svg
                    ><span class="wd-sr-only">Close menu</span>
                </button>
            </div>
            <div data-nav="drawer"></div>
        </dialog>

        <dialog id="modal" class="ci-dialog"></dialog>
