name: Foundation frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check changed frontend formatting
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run format:check:changed
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Check component types
        run: npm run typecheck
      - name: Test authentication and workspace interactions
        run: npm test
      - name: Build Inertia application
        run: npm run build
