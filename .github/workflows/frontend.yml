name: Foundation frontend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify checkout and formatting base
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRETTIER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          case "$PRETTIER_BASE_REF" in
            ''|0000000000000000000000000000000000000000)
              # First push of a branch: format-changed.mjs compares against the merge base with the default branch.
              git -C "$GITHUB_WORKSPACE" rev-parse --verify "origin/$PRETTIER_DEFAULT_BRANCH^{commit}" ;;
            *) git -C "$GITHUB_WORKSPACE" cat-file -e "$PRETTIER_BASE_REF^{commit}" ;;
          esac
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check changed frontend formatting
        env:
          PRETTIER_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRETTIER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run format:check:changed
      - name: Check dependency advisories
        run: |
          node scripts/check-npm-audit.mjs --self-test
          node scripts/check-npm-audit.mjs
      - name: Check component types
        run: npm run typecheck
      - name: Test authentication and workspace interactions
        run: npm test
      - name: Build Inertia application
        run: npm run build
