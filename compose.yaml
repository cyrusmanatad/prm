name: weavdash
x-backend: &backend
  build:
    context: ./src
    dockerfile: docker/Dockerfile
  env_file: ./src/.env
  environment: &runtime
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: weavdash
    DB_USERNAME: weavdash_app
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in src/.env}
    REDIS_HOST: redis
    REDIS_CLIENT: phpredis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: database
    MAIL_MAILER: array
    MIGRATION_DB_PASSWORD: ''
    MIGRATION_DB_USERNAME: ''
    POSTGRES_PASSWORD: ''
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - private-storage:/var/www/html/storage/app/private
services:
  postgres:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: weavdash
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/.env}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in src/.env}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in src/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-weavdash.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d weavdash']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-bookworm@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    <<: *backend
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 10
  worker:
    <<: *backend
    init: true
    command: [php, artisan, 'queue:work', redis, '--sleep=3', '--tries=3', '--timeout=60', '--max-time=3600']
    restart: unless-stopped
  scheduler:
    <<: *backend
    init: true
    command: [php, artisan, 'schedule:work']
    restart: unless-stopped
  migrate:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *runtime
      DB_USERNAME: weavdash_migrator
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in src/.env}
    command: [php, artisan, migrate, --force]
  acceptance:
    <<: *backend
    profiles: [tools]
    environment:
      <<: *runtime
      APP_ENV: testing
      # Fixture control connection only; never provided to web/worker/scheduler.
      TEST_MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in src/.env}
    command: [vendor/bin/phpunit, '-c', phpunit.acceptance.xml]
volumes:
  postgres-data:
  redis-data:
  private-storage:
